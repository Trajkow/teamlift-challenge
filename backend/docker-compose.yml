services:
  postgres:
    image: postgres:16-alpine
    container_name: slot_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: slot_db
    ports:
      - '5433:5432'
    volumes:
      - slot_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  slot_pg:
