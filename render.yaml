# Render blueprint: backend API on the free plan. Secrets are entered in the dashboard (sync: false).
services:
  - type: web
    name: slot-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npx prisma generate --config prisma.config.ts && npx prisma migrate deploy --config prisma.config.ts && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: TRUST_PROXY
        value: "1"
      - key: APP_TIME_ZONE
        value: Europe/Skopje
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: DATABASE_URL # Neon pooled connection string
        sync: false
      - key: MIGRATE_DATABASE_URL # Neon direct (non-pooled) connection string
        sync: false
      - key: FRONTEND_ORIGIN # Vercel URL, e.g. https://<project>.vercel.app
        sync: false
      - key: HOST_NAME # shown in the UI, optional
        sync: false
      - key: GEMINI_API_KEY # optional, without it the template message is used
        sync: false
      - key: GEMINI_MODEL # optional
        sync: false
      # HOST_KEY is intentionally not set in production.
